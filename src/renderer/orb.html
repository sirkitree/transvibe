<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>transvibe orb</title>
  <style>
    /* Nothing here has a background. The window is transparent and permanently
       click-through, so the only thing on screen is what the canvas paints. */
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      /* Belt and braces: the window is click-through from the main process,
         and nothing in here is a drag or selection target either. */
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="orb"></canvas>
  <script type="module" src="orb-window.js"></script>
</body>
</html>
